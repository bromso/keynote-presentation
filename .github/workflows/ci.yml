name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build for the Pages sub-path
        run: bun run build
        env:
          DECK_BASE: /${{ github.event.repository.name }}/
      # Pages has no rewrite rules; serving the app for unknown paths lets a
      # deep link such as /s/design-loop?p=5 load directly.
      - run: cp apps/deck/dist/index.html apps/deck/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/deck/dist
      - id: deployment
        uses: actions/deploy-pages@v5
